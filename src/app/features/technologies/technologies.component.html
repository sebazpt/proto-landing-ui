<section id="technologies" class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-section-header
      title="Technologies"
      subtitle="The tools and technologies I work with every day." />

    <div class="space-y-10">
      @for (group of groupedTechnologies(); track group.category) {
        <div>
          <h3 class="text-lg font-semibold text-slate-700 mb-4">{{ group.label }}</h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4">
            @for (tech of group.items; track tech.name) {
              <app-tech-card [tech]="tech" />
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
