<section id="portfolio" class="py-20 bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-section-header
      title="Portfolio"
      subtitle="A selection of projects I've worked on recently." />

    @if (portfolioService.isLoading()) {
      <div class="flex justify-center py-12">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
      </div>
    } @else if (portfolioService.error()) {
      <p class="text-center text-red-500 py-8">{{ portfolioService.error() }}</p>
    } @else {
      <app-portfolio-grid [items]="portfolioService.items()" />
    }
  </div>
</section>
