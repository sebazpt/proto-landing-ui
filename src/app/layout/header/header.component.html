<header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-sm border-b border-slate-200">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a
        class="text-xl font-bold text-slate-900 cursor-pointer hover:text-blue-600 transition-colors"
        (click)="onNavigate('hero')">
        Landing Site
      </a>

      <!-- Desktop Navigation -->
      <ul class="hidden md:flex items-center gap-8">
        @for (link of navLinks; track link.sectionId) {
          <li>
            <a
              class="text-sm font-medium text-slate-600 hover:text-blue-600 cursor-pointer transition-colors"
              (click)="onNavigate(link.sectionId)">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <!-- Mobile Menu Button -->
      <button
        type="button"
        class="md:hidden p-2 text-slate-600 hover:text-slate-900"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMobileMenu()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          @if (isMobileMenuOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          }
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    @if (isMobileMenuOpen()) {
      <ul class="md:hidden pb-4 space-y-2">
        @for (link of navLinks; track link.sectionId) {
          <li>
            <a
              class="block px-3 py-2 text-base font-medium text-slate-600 hover:text-blue-600 hover:bg-slate-50 rounded-md cursor-pointer transition-colors"
              (click)="onNavigate(link.sectionId)">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    }
  </nav>
</header>
