services:
  proto-landing-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proto-landing-ui
    ports:
      - "${HOST_PORT:-8082}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

